<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Greeting Card for Shamanth NS</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f6d365 0%, #fda085 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .card-container {
            perspective: 1000px;
        }

        .card {
            background-color: #ffffff;
            width: 100%;
            max-width: 450px;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.15);
            text-align: center;
            transition: transform 0.4s ease, box-shadow 0.4s ease;
            position: relative;
            overflow: hidden;
        }

        .card:hover {
            transform: translateY(-10px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 8px;
            background: linear-gradient(90deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
        }

        h1 {
            color: #333333;
            font-size: 28px;
            margin-bottom: 5px;
            letter-spacing: 1px;
        }

        .recipient-name {
            color: #ff6b6b;
            font-size: 34px;
            font-weight: 800;
            margin: 10px 0 25px 0;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        p {
            color: #555555;
            font-size: 18px;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .divider {
            width: 50px;
            height: 3px;
            background-color: #ff6b6b;
            margin: 0 auto 25px auto;
            border-radius: 2px;
        }

        .signature {
            font-style: italic;
            color: #888888;
            font-size: 16px;
        }

        .confetti {
            font-size: 40px;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

    <div class="card-container">
        <div class="card">
            <div class="confetti">✨🎉✨</div>
            <h1>Warmest Wishes,</h1>
            <div class="recipient-name">Shamanth NS</div>
            <div class="divider"></div>
            <p>Wishing you a fantastic day filled with joy, success, and great moments. May all your upcoming endeavors bring you happiness and prosperity!</p>
            <div class="signature">
                Best Regards,<br>
                [Your Name]
            </div>
        </div>
    </div>

</body>
</html>
